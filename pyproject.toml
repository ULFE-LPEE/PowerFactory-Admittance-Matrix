[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "admittance_matrix"
version = "0.2.0.dev0"
description = "Python library for building admittance matrices from DIgSILENT PowerFactory networks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Martin Valencic"}
]
keywords = ["powerfactory", "admittance", "matrix", "power-systems", "stability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
speed = [
    "scipy>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.16.9",
]
notebook = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/ULFE-LPEE/PowerFactory-Admittance-Matrix"
Documentation = "https://github.com/ULFE-LPEE/PowerFactory-Admittance-Matrix#readme"
Repository = "https://github.com/ULFE-LPEE/PowerFactory-Admittance-Matrix"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312" # in the default example docs

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false